<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141a3a" />
    <script>
      try {
        var theme = localStorage.getItem('zywe-slowo:theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        var font = localStorage.getItem('zywe-slowo:font-set');
        if (font === 'outfit') document.documentElement.dataset.fontSet = font;
      } catch (e) { /* default light theme */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
